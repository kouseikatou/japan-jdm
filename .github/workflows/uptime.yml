name: Uptime

on:
  schedule:
    - cron: '17 * * * *' # hourly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check key pages and assets
        run: |
          set -u
          fail=0
          for path in / /ja/ /pt/ /zh/ /ko/ /shipping/ /contact/ /sitemap-index.xml /img/hero-loop.mp4; do
            code=$(curl -s -o /dev/null -m 20 -L -w '%{http_code}' "https://japan-jdm.com${path}")
            echo "${path} -> ${code}"
            if [ "$code" != "200" ]; then fail=1; fi
          done
          # The contact API must reject GET with 405 (proves the Worker is running).
          api=$(curl -s -o /dev/null -m 20 -w '%{http_code}' https://japan-jdm.com/api/contact)
          echo "/api/contact -> ${api}"
          if [ "$api" != "405" ]; then fail=1; fi
          exit $fail
